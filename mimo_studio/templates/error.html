{% extends "base.html" %}
{% block title %}{{ code }} · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] flex-col items-center justify-center text-center">
  <p class="text-[64px] font-black leading-none text-slate-200 dark:text-slate-800">{{ code }}</p>
  <p class="mt-3 text-[15px] font-semibold">{{ message }}</p>
  <div class="mt-6 flex gap-2">
    <a href="/" class="rounded-lg bg-brand-600 px-4 py-2 text-[13px] font-semibold text-white">返回首页</a>
    <a href="/login" class="rounded-lg border border-slate-200 px-4 py-2 text-[13px] font-medium text-slate-600 dark:border-slate-700 dark:text-slate-300">去登录</a>
  </div>
</div>
{% endblock %}
