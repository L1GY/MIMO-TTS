<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
          fontFamily: { sans: ['Inter','system-ui','-apple-system','PingFang SC','Microsoft YaHei','sans-serif'] },
          boxShadow: { soft: '0 2px 12px -4px rgba(15,23,42,.12)' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function () {
      var saved = localStorage.getItem('mimo-theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">

<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">

  <!-- 背景装饰 -->
  <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-brand-300/30 blur-3xl dark:bg-brand-700/20"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-16 h-72 w-72 rounded-full bg-violet-300/30 blur-3xl dark:bg-violet-700/20"></div>

  <div class="relative w-full max-w-[420px]">

    <div class="mb-7 text-center">
      <div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-violet-500 text-white shadow-lg shadow-brand-500/30">
        <i class="fa-solid fa-wave-square text-lg"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight">{{ APP_NAME }}</h1>
      <p class="mt-1 text-[13px] text-slate-500 dark:text-slate-400">{{ APP_SUBTITLE }}</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft sm:p-7 dark:border-slate-800 dark:bg-slate-900">
      {% block card %}{% endblock %}
    </div>

    <p class="mt-6 text-center text-[11.5px] text-slate-400 dark:text-slate-500">
      语音能力由 MiMo 官方 API 提供 · 请妥善保管账号
    </p>
  </div>
</div>

<div id="toastHost" class="pointer-events-none fixed bottom-5 right-5 z-[100] flex w-[min(360px,calc(100vw-2.5rem))] flex-col gap-2"></div>
<script src="/static/js/app.js"></script>

{% if err_msg %}
<script>window.addEventListener('DOMContentLoaded', function () { window.toast({{ err_msg|tojson }}, 'error'); });</script>
{% endif %}
{% if ok_msg %}
<script>window.addEventListener('DOMContentLoaded', function () { window.toast({{ ok_msg|tojson }}, 'success'); });</script>
{% endif %}
</body>
</html>
