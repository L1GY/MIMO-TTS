{% extends "base_auth.html" %}
{% block title %}注册 · {{ APP_NAME }}{% endblock %}

{% block card %}
<h2 class="text-[17px] font-bold">创建账号</h2>
<p class="mt-1 text-[12.5px] text-slate-500 dark:text-slate-400">注册即送免费合成额度，可用于体验声音克隆</p>

<form method="post" action="/register" class="mt-6 space-y-4" id="registerForm">
  <div>
    <label class="mb-1.5 block text-[12.5px] font-medium text-slate-600 dark:text-slate-300">用户名</label>
    <div class="relative">
      <i class="fa-regular fa-user pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] text-slate-400"></i>
      <input type="text" name="username" required autofocus minlength="3" maxlength="24"
             value="{{ (form or {}).get('username', '') }}"
             placeholder="3-24 位，支持中英文、数字、_ . -"
             class="w-full rounded-lg border-slate-300 bg-white py-2.5 pl-9 pr-3 text-[13.5px] placeholder:text-slate-400 focus:border-brand-500 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-950">
    </div>
  </div>

  <div>
    <label class="mb-1.5 block text-[12.5px] font-medium text-slate-600 dark:text-slate-300">密码</label>
    <div class="relative">
      <i class="fa-solid fa-lock pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] text-slate-400"></i>
      <input type="password" name="password" required minlength="6" autocomplete="new-password"
             placeholder="至少 6 位"
             class="w-full rounded-lg border-slate-300 bg-white py-2.5 pl-9 pr-10 text-[13.5px] placeholder:text-slate-400 focus:border-brand-500 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-950">
      <button type="button" class="js-toggle-pw absolute right-2.5 top-1/2 -translate-y-1/2 px-1 text-[12.5px] text-slate-400 hover:text-slate-600">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>
  </div>

  <div>
    <label class="mb-1.5 block text-[12.5px] font-medium text-slate-600 dark:text-slate-300">确认密码</label>
    <div class="relative">
      <i class="fa-solid fa-lock pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] text-slate-400"></i>
      <input type="password" name="password2" required minlength="6" autocomplete="new-password"
             placeholder="再输入一次密码"
             class="w-full rounded-lg border-slate-300 bg-white py-2.5 pl-9 pr-3 text-[13.5px] placeholder:text-slate-400 focus:border-brand-500 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-950">
    </div>
  </div>

  <div>
    <label class="mb-1.5 block text-[12.5px] font-medium text-slate-600 dark:text-slate-300">
      邮箱 <span class="font-normal text-slate-400">（选填）</span>
    </label>
    <div class="relative">
      <i class="fa-regular fa-envelope pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] text-slate-400"></i>
      <input type="email" name="email" value="{{ (form or {}).get('email', '') }}"
             placeholder="you@example.com"
             class="w-full rounded-lg border-slate-300 bg-white py-2.5 pl-9 pr-3 text-[13.5px] placeholder:text-slate-400 focus:border-brand-500 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-950">
    </div>
  </div>

  <button type="submit"
          class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-brand-600 py-2.5 text-[14px] font-semibold text-white shadow-soft transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-60">
    <span>注册并登录</span>
  </button>
</form>

<p class="mt-5 text-center text-[12.5px] text-slate-500 dark:text-slate-400">
  已有账号？<a href="/login" class="font-semibold text-brand-600 hover:underline dark:text-brand-400">去登录</a>
</p>
{% endblock %}
