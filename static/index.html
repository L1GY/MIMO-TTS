<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 声坊</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-wrap">

  <aside class="auth-brand">
    <div class="brand">
      <span class="mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12h.5M9 7v10M15 3.5v17M21 9v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="name">声坊<em>VOICE ATELIER</em></span>
    </div>

    <div class="pitch">
      <h1>先有声音，<br>再有表达。</h1>
      <p>合成、调音色、把语音转成文字——都在同一处完成，生成即可试听。</p>
      <canvas class="wave wave-hero" id="brandWave" style="margin-top:26px"></canvas>
    </div>

    <div class="foot">登录后可立即开始</div>
  </aside>

  <main class="auth-panel">
    <div class="auth-card">
      <div class="navpills" role="tablist" style="margin-bottom:24px">
        <button role="tab" id="tab-login" aria-selected="true" style="flex:1">登录</button>
        <button role="tab" id="tab-register" aria-selected="false" style="flex:1">注册</button>
      </div>

      <div id="pane-login" role="tabpanel">
        <h2>欢迎回来</h2>
        <p class="sub">登录后继续使用你的音色与记录。</p>
        <div id="loginAlert"></div>

        <form id="loginForm" novalidate>
          <label class="field">
            <span class="label">用户名或邮箱</span>
            <input type="text" name="username" autocomplete="username" placeholder="例如 alice" required>
          </label>
          <label class="field">
            <span class="label">密码</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="至少 6 位" required>
          </label>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginBtn">登录</button>
        </form>

        <div class="divider" id="wxDivider" hidden>或</div>
        <button class="wx-btn" id="wxBtn" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9.2 3C5.1 3 1.8 5.8 1.8 9.2c0 2 1.1 3.7 2.9 4.9l-.7 2.2 2.5-1.3c.9.2 1.7.4 2.7.4h.6a5.6 5.6 0 0 1-.2-1.4c0-3.4 3.3-6 7.4-6h.6C17.1 5 13.5 3 9.2 3Z" fill="#2DC100"/>
            <path d="M22.2 14.6c0-2.7-2.7-4.9-6-4.9s-6 2.2-6 4.9c0 2.7 2.7 4.9 6 4.9.7 0 1.4-.1 2.1-.3l2 1-.5-1.7c1.5-.9 2.4-2.2 2.4-3.9Z" fill="#2DC100"/>
          </svg>
          使用微信扫码登录
        </button>
      </div>

      <div id="pane-register" role="tabpanel" hidden>
        <h2>创建账号</h2>
        <p class="sub">半分钟就好，马上生成第一段声音。</p>
        <div id="regAlert"></div>

        <form id="regForm" novalidate>
          <label class="field">
            <span class="label">用户名</span>
            <input type="text" name="username" autocomplete="username" placeholder="3-32 位字母、数字、_ . -" required>
          </label>
          <label class="field">
            <span class="label">密码</span>
            <input type="password" name="password" autocomplete="new-password" placeholder="至少 6 位" required>
          </label>
          <label class="field">
            <span class="label">邮箱（可选，也可用于登录）</span>
            <input type="email" name="email" autocomplete="email" placeholder="you@example.com">
          </label>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="regBtn">注册并登录</button>
        </form>
      </div>
    </div>
  </main>
</div>

<div id="toasts"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/wave.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
