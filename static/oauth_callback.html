<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信登录 · VoiceLab</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="overlay is-open">
    <div class="overlay-card" style="text-align:center">
      <div id="slot"><span class="spinner" style="display:inline-block;border-color:var(--border-2);border-top-color:var(--primary)"></span></div>
      <p class="sub" id="msg" style="margin-top:12px;margin-bottom:0">正在完成微信登录…</p>
    </div>
  </div>

<script src="/static/js/api.js"></script>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var token = p.get('token');
  var error = p.get('error');
  var msg = document.getElementById('msg');

  if (token) {
    Api.setSession(token, {});
    msg.textContent = '登录成功，正在进入首页…';
    setTimeout(function () {
      try { if (window.opener) window.opener.location.href = '/'; } catch (e) {}
      window.close();
      location.href = '/';
    }, 500);
  } else {
    var text = {
      wechat_cancelled: '你取消了微信授权',
      wechat_state_invalid: '登录请求已过期，请重新发起'
    }[error] || '微信登录未完成';
    msg.textContent = text + '，正在返回首页…';
    setTimeout(function () { location.href = '/'; }, 1400);
  }
})();
</script>
</body>
</html>
